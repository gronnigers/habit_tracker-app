<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Habits">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Habits</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#15171d; --muted:#8b91a1; --line:#eceef2;
    --green:#22c55e; --greenbg:#e9f9ef; --yellow:#f5b408; --yellowbg:#fdf3d8;
    --red:#ef4444; --redbg:#fdeaea; --blue:#3b82f6; --bluebg:#e8f0fe;
    --shadow:0 1px 3px rgba(20,23,33,.06),0 6px 20px rgba(20,23,33,.05);
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased; -webkit-user-select:none; user-select:none;}
  html,body{height:100%;}
  body{background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;}
  #app{max-width:480px; margin:0 auto; height:100%; position:relative; display:flex; flex-direction:column; background:var(--bg); padding-top:var(--safe-t);}

  .topbar{padding:14px 18px 6px; display:flex; align-items:center; justify-content:space-between;}
  .datenav{display:flex; align-items:center; gap:10px;}
  .datenav h1{font-size:22px; font-weight:800; letter-spacing:-.4px;}
  .datenav .sub{font-size:12px; color:var(--muted); margin-top:1px;}
  .chev{width:34px; height:34px; border-radius:12px; background:var(--card); box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; font-size:16px; color:#444; border:none;}
  .chev:active{transform:scale(.92);}
  .chev:disabled{opacity:.3;}
  .right-tools{display:flex; align-items:center; gap:8px;}
  .todaybtn{font-size:12px; font-weight:700; color:var(--blue); background:var(--bluebg);
    border:none; padding:7px 12px; border-radius:20px;}
  .todaybtn.hidden{display:none;}
  .syncpill{font-size:11px; font-weight:700; padding:5px 10px; border-radius:20px; border:none;
    background:#f0f1f4; color:#9aa0ad; display:flex; align-items:center; gap:5px;}
  .syncpill .dot{width:7px; height:7px; border-radius:50%; background:#c7ccd6;}
  .syncpill.ok .dot{background:var(--green);} .syncpill.ok{color:#1a9f4b; background:var(--greenbg);}
  .syncpill.pending .dot{background:var(--yellow);} .syncpill.pending{color:#b5820a; background:var(--yellowbg);}
  .syncpill.off .dot{background:var(--muted);}

  .scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:8px 16px calc(78px + var(--safe-b));}

  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px;}
  .tile{background:var(--card); border-radius:22px; padding:16px; box-shadow:var(--shadow);
    position:relative; min-height:132px; display:flex; flex-direction:column; justify-content:space-between;
    transition:transform .08s; overflow:hidden; border:1.5px solid transparent;}
  .tile:active{transform:scale(.96);}
  .tile.done{border-color:var(--green);}
  .tile.partial{border-color:var(--yellow);}
  .tile .ic{font-size:26px;}
  .tile .nm{font-size:15px; font-weight:700; margin-top:2px;}
  .tile .hint{font-size:11px; color:var(--muted); margin-top:2px; line-height:1.3;}
  .tile .val{font-size:30px; font-weight:800; letter-spacing:-.5px; line-height:1;}
  .tile .valsub{font-size:11px; color:var(--muted); font-weight:600;}
  .tile .badge{position:absolute; top:14px; right:14px; font-size:11px; font-weight:800; padding:4px 9px; border-radius:20px;}
  .b-green{background:var(--greenbg); color:#1a9f4b;}
  .b-yellow{background:var(--yellowbg); color:#b5820a;}
  .b-gray{background:#f0f1f4; color:#9aa0ad;}
  .b-blue{background:var(--bluebg); color:#2b6fd6;}
  .seg{display:flex; gap:5px; margin-top:8px;}
  .seg i{flex:1; height:7px; border-radius:5px; background:#eceef2;}
  .seg i.on{background:var(--green);}
  .tile .foot{display:flex; align-items:flex-end; justify-content:space-between;}
  .longhint{text-align:center; font-size:11px; color:var(--muted); margin-top:16px;}

  .tabbar{position:absolute; bottom:0; left:0; right:0; height:calc(64px + var(--safe-b));
    padding-bottom:var(--safe-b); background:rgba(255,255,255,.92); backdrop-filter:blur(14px);
    border-top:1px solid var(--line); display:flex;}
  .tabbar button{flex:1; border:none; background:none; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:3px; font-size:11px; color:var(--muted); font-weight:600;}
  .tabbar button .ti{font-size:20px;}
  .tabbar button.on{color:var(--ink);}

  .seg-toggle{display:flex; background:#eceef2; border-radius:14px; padding:4px; margin:12px 0 4px;}
  .seg-toggle button{flex:1; border:none; background:none; padding:8px; font-size:13px; font-weight:700;
    color:var(--muted); border-radius:10px;}
  .seg-toggle button.on{background:var(--card); color:var(--ink); box-shadow:var(--shadow);}
  .card{background:var(--card); border-radius:20px; padding:16px; box-shadow:var(--shadow); margin-top:14px;}
  .card h3{font-size:13px; font-weight:800;}
  .card .csub{font-size:11px; color:var(--muted); margin-top:2px;}

  .wk-item{margin-top:16px;} .wk-item:first-child{margin-top:6px;}
  .wk-top{display:flex; justify-content:space-between; font-size:14px; font-weight:700; margin-bottom:8px;}
  .wk-top span:last-child{color:var(--muted); font-weight:600; font-size:12px;}
  .track{height:10px; background:#eceef2; border-radius:8px; overflow:hidden;}
  .track i{display:block; height:100%; border-radius:8px;}
  .dots{display:flex; gap:5px; margin-top:9px;}
  .dots b{flex:1; aspect-ratio:1; max-width:30px; border-radius:7px; background:#eceef2; font-size:10px;
    color:#b3b8c2; display:flex; align-items:center; justify-content:center; font-weight:800;}

  .hm{margin-top:14px;} .hm-row{margin-bottom:14px;}
  .hm-lab{display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:7px;}
  .hm-lab span:last-child{color:var(--muted); font-weight:600; font-size:11px;}
  .hm-grid{display:grid; grid-template-columns:repeat(14,1fr); gap:4px;}
  .hm-grid i{aspect-ratio:1; border-radius:4px; background:#eceef2;}
  .heat-1{background:#c7ecd4;} .heat-2{background:#7ed99b;} .heat-3{background:#3ec46b;} .heat-4{background:#1a9f4b;}

  .filterbar{display:flex; gap:8px; overflow-x:auto; padding:12px 0 2px; -webkit-overflow-scrolling:touch;}
  .filterbar::-webkit-scrollbar{display:none;}
  .chip{flex:none; border:none; background:var(--card); box-shadow:var(--shadow); font-size:12px; font-weight:700;
    color:var(--muted); padding:8px 14px; border-radius:20px;}
  .chip.on{background:var(--ink); color:#fff;}
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-top:14px;}
  .cal-head h3{font-size:16px; font-weight:800;}
  .wd{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; font-size:10px; color:var(--muted);
    text-align:center; margin:12px 0 8px; font-weight:700;}
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal b{aspect-ratio:1; border-radius:11px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; font-size:12px; font-weight:700; background:var(--card); color:#3a3f4a;
    box-shadow:var(--shadow); position:relative;}
  .cal b.empty{background:transparent; box-shadow:none;}
  .cal b.today{outline:2px solid var(--ink); outline-offset:1px;}
  .cal b .mv{font-size:9px; font-weight:800; margin-top:1px;}
  .cal b.g{background:var(--greenbg); color:#1a9f4b;}
  .cal b.y{background:var(--yellowbg); color:#b5820a;}
  .cal b.r{background:var(--redbg); color:#c0392b;}
  .cal b.dots-day{padding:0;}
  .minidots{display:flex; gap:2px; margin-top:3px;}
  .minidots u{width:5px; height:5px; border-radius:50%; background:#dfe2e8;}
  .legend{display:flex; gap:14px; margin-top:16px; font-size:11px; color:var(--muted); flex-wrap:wrap;}
  .legend i{display:inline-block; width:11px; height:11px; border-radius:4px; margin-right:5px; vertical-align:-1px;}

  .view{display:none;} .view.on{display:block;}

  .sheet-back{position:fixed; inset:0; background:rgba(10,12,18,.4); opacity:0; pointer-events:none;
    transition:opacity .2s; z-index:50;}
  .sheet-back.on{opacity:1; pointer-events:auto;}
  .sheet{position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; background:var(--card);
    border-radius:26px 26px 0 0; padding:20px 20px calc(24px + var(--safe-b)); transform:translateY(110%);
    transition:transform .26s cubic-bezier(.3,.9,.3,1); z-index:51;}
  .sheet.on{transform:translateY(0);}
  .sheet .grab{width:40px; height:5px; border-radius:5px; background:#e2e4ea; margin:0 auto 14px;}
  .sheet h2{font-size:19px; font-weight:800; text-align:center;}
  .sheet .sh-sub{font-size:13px; color:var(--muted); text-align:center; margin-top:4px;}
  .quickrow{display:flex; gap:8px; justify-content:center; margin-top:18px; flex-wrap:wrap;}
  .quick{border:none; background:var(--bg); font-size:16px; font-weight:800; padding:14px 0; border-radius:16px; flex:1; min-width:60px; color:var(--ink);}
  .quick:active{background:#e6e8ee;}
  .numdisplay{font-size:46px; font-weight:800; text-align:center; margin:10px 0 4px; letter-spacing:-1px;}
  .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px;}
  .pad button{border:none; background:var(--bg); font-size:22px; font-weight:700; padding:16px 0; border-radius:16px;}
  .pad button:active{background:#e6e8ee;}
  .sheet .save{width:100%; margin-top:16px; border:none; background:var(--ink); color:#fff; font-size:16px; font-weight:800; padding:16px; border-radius:16px;}
  .sheet .save:active{opacity:.85;}
  .adjrow{display:flex; align-items:center; justify-content:center; gap:22px; margin-top:20px;}
  .adjrow button{width:56px; height:56px; border-radius:50%; border:none; background:var(--bg); font-size:26px; font-weight:700; display:flex; align-items:center; justify-content:center;}
  .adjrow button:active{background:#e6e8ee;}
  .adjrow .cnt{font-size:44px; font-weight:800; min-width:70px; text-align:center;}
  .vitrow{display:flex; gap:12px; margin-top:18px;}
  .vitbtn{flex:1; border:2px solid var(--line); background:var(--card); border-radius:18px; padding:16px 10px; text-align:center; font-weight:700; font-size:14px; color:var(--ink);}
  .vitbtn .vi{font-size:24px; display:block; margin-bottom:4px;}
  .vitbtn.on{border-color:var(--green); background:var(--greenbg); color:#1a9f4b;}
  .sesslist{font-size:12px; color:var(--muted); text-align:center; margin-top:14px; line-height:1.6;}

  .toast{position:fixed; bottom:calc(84px + var(--safe-b)); left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; font-size:13px; font-weight:600; padding:10px 18px; border-radius:22px;
    opacity:0; transition:all .25s; z-index:60; pointer-events:none; white-space:nowrap;}
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0);}

  /* gate / sign-in */
  .gate{position:fixed; inset:0; z-index:80; background:linear-gradient(180deg,#ffffff,#eef1f6);
    display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px;}
  .gate.on{display:flex;}
  .gate .logo{width:88px; height:88px; border-radius:26px; background:linear-gradient(135deg,#22c55e,#3b82f6);
    display:flex; align-items:center; justify-content:center; font-size:44px; box-shadow:var(--shadow); margin-bottom:22px;}
  .gate h1{font-size:26px; font-weight:800;}
  .gate p{color:var(--muted); font-size:14px; margin-top:10px; max-width:280px; line-height:1.5;}
  .gate button{margin-top:28px; border:none; background:var(--ink); color:#fff; font-size:16px; font-weight:800;
    padding:15px 28px; border-radius:16px;}
  .gate .err{margin-top:18px; font-size:12px; color:var(--red); max-width:300px;}
  .gate code{background:#eceef2; padding:2px 6px; border-radius:6px; font-size:12px;}
</style>
</head>
<body>
<div id="app">
  <section class="view on" id="v-today">
    <div class="topbar">
      <div class="datenav">
        <button class="chev" id="prevDay">&#8249;</button>
        <div><h1 id="dayTitle">Today</h1><div class="sub" id="dayDate">&mdash;</div></div>
        <button class="chev" id="nextDay">&#8250;</button>
      </div>
      <div class="right-tools">
        <button class="todaybtn hidden" id="jumpToday">Today</button>
        <button class="syncpill off" id="syncPill"><span class="dot"></span><span id="syncTxt">&hellip;</span></button>
      </div>
    </div>
    <div class="scroll"><div class="tiles" id="tiles"></div>
      <div class="longhint">Tap a tile to log &middot; press &amp; hold to edit or correct</div>
    </div>
  </section>

  <section class="view" id="v-history">
    <div class="topbar"><div class="datenav"><div><h1>History</h1><div class="sub">Your track record</div></div></div></div>
    <div class="scroll">
      <div class="seg-toggle" id="histToggle">
        <button data-h="week" class="on">Week</button>
        <button data-h="14day">14 Days</button>
        <button data-h="month">Month</button>
      </div>
      <div id="hist-week" class="hview"></div>
      <div id="hist-14day" class="hview" style="display:none"></div>
      <div id="hist-month" class="hview" style="display:none"></div>
    </div>
  </section>

  <nav class="tabbar">
    <button id="tab-today" class="on"><span class="ti">&#9673;</span>Today</button>
    <button id="tab-history"><span class="ti">&#128200;</span>History</button>
  </nav>
</div>

<div class="sheet-back" id="sheetBack"></div>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<div class="gate" id="gate">
  <div class="logo">&#9989;</div>
  <h1>Habits</h1>
  <p id="gateMsg">Sign in with your Microsoft account to sync your habits to OneDrive.</p>
  <button id="signInBtn">Sign in with Microsoft</button>
  <div class="err" id="gateErr"></div>
</div>

<label id="hapticSwitch" style="position:absolute;opacity:0;pointer-events:none;width:0;height:0;overflow:hidden">
  <input type="checkbox" switch>
</label>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.7.1/lib/msal-browser.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
  }
</script>
</body>
</html>
