<title>Habits</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#15171d; --muted:#8b91a1; --line:#eceef2;
    --green:#22c55e; --greenbg:#e9f9ef; --yellow:#f5b408; --yellowbg:#fdf3d8;
    --red:#ef4444; --redbg:#fdeaea; --blue:#3b82f6; --bluebg:#e8f0fe;
    --shadow:0 1px 3px rgba(20,23,33,.06),0 6px 20px rgba(20,23,33,.05);
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased; -webkit-user-select:none; user-select:none;}
  html,body{height:100%;}
  body{background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;}
  #app{max-width:480px; margin:0 auto; height:100%; position:relative; display:flex; flex-direction:column; background:var(--bg); padding-top:var(--safe-t);}

  .topbar{padding:14px 18px 6px; display:flex; align-items:center; justify-content:space-between;}
  .datenav{display:flex; align-items:center; gap:10px;}
  .datenav h1{font-size:22px; font-weight:800; letter-spacing:-.4px;}
  .datenav .sub{font-size:12px; color:var(--muted); margin-top:1px;}
  .chev{width:34px; height:34px; border-radius:12px; background:var(--card); box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; font-size:16px; color:#444; border:none;}
  .chev:active{transform:scale(.92);} .chev:disabled{opacity:.3;}
  .right-tools{display:flex; align-items:center; gap:8px;}
  .todaybtn{font-size:12px; font-weight:700; color:var(--blue); background:var(--bluebg); border:none; padding:7px 12px; border-radius:20px;}
  .todaybtn.hidden{display:none;}
  .syncpill{font-size:11px; font-weight:700; padding:5px 10px; border-radius:20px; border:none; background:#f0f1f4; color:#9aa0ad; display:flex; align-items:center; gap:5px;}
  .syncpill .dot{width:7px; height:7px; border-radius:50%; background:#c7ccd6;}
  .syncpill.ok .dot{background:var(--green);} .syncpill.ok{color:#1a9f4b; background:var(--greenbg);}
  .syncpill.pending .dot{background:var(--yellow);} .syncpill.pending{color:#b5820a; background:var(--yellowbg);}
  .syncpill.off .dot{background:var(--muted);}

  .scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:8px 16px calc(78px + var(--safe-b));}

  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px;}
  .tile{background:var(--card); border-radius:22px; padding:16px; box-shadow:var(--shadow); position:relative; min-height:132px; display:flex; flex-direction:column; justify-content:space-between; transition:transform .08s; overflow:hidden; border:1.5px solid transparent;}
  .tile:active{transform:scale(.96);}
  .tile.done{border-color:var(--green);} .tile.partial{border-color:var(--yellow);}
  .tile .ic{font-size:26px;}
  .tile .nm{font-size:15px; font-weight:700; margin-top:2px;}
  .tile .hint{font-size:11px; color:var(--muted); margin-top:2px; line-height:1.3;}
  .tile .val{font-size:30px; font-weight:800; letter-spacing:-.5px; line-height:1;}
  .tile .valsub{font-size:11px; color:var(--muted); font-weight:600;}
  .tile .badge{position:absolute; top:14px; right:14px; font-size:11px; font-weight:800; padding:4px 9px; border-radius:20px;}
  .b-green{background:var(--greenbg); color:#1a9f4b;} .b-yellow{background:var(--yellowbg); color:#b5820a;}
  .b-gray{background:#f0f1f4; color:#9aa0ad;} .b-blue{background:var(--bluebg); color:#2b6fd6;}
  .seg{display:flex; gap:5px; margin-top:8px;}
  .seg i{flex:1; height:7px; border-radius:5px; background:#eceef2;}
  .seg i.on{background:var(--green);}
  .tile .foot{display:flex; align-items:flex-end; justify-content:space-between;}
  .longhint{text-align:center; font-size:11px; color:var(--muted); margin-top:16px;}

  .tabbar{position:absolute; bottom:0; left:0; right:0; height:calc(64px + var(--safe-b)); padding-bottom:var(--safe-b); background:rgba(255,255,255,.92); backdrop-filter:blur(14px); border-top:1px solid var(--line); display:flex;}
  .tabbar button{flex:1; border:none; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:11px; color:var(--muted); font-weight:600;}
  .tabbar button .ti{font-size:20px;} .tabbar button.on{color:var(--ink);}

  .seg-toggle{display:flex; background:#eceef2; border-radius:14px; padding:4px; margin:12px 0 4px;}
  .seg-toggle button{flex:1; border:none; background:none; padding:8px; font-size:13px; font-weight:700; color:var(--muted); border-radius:10px;}
  .seg-toggle button.on{background:var(--card); color:var(--ink); box-shadow:var(--shadow);}
  .card{background:var(--card); border-radius:20px; padding:16px; box-shadow:var(--shadow); margin-top:14px;}
  .card h3{font-size:13px; font-weight:800;} .card .csub{font-size:11px; color:var(--muted); margin-top:2px;}

  .wk-item{margin-top:16px;} .wk-item:first-child{margin-top:6px;}
  .wk-top{display:flex; justify-content:space-between; font-size:14px; font-weight:700; margin-bottom:8px;}
  .wk-top span:last-child{color:var(--muted); font-weight:600; font-size:12px;}
  .track{height:10px; background:#eceef2; border-radius:8px; overflow:hidden;}
  .track i{display:block; height:100%; border-radius:8px;}
  .dots{display:flex; gap:5px; margin-top:9px;}
  .dots b{flex:1; aspect-ratio:1; max-width:30px; border-radius:7px; background:#eceef2; font-size:10px; color:#b3b8c2; display:flex; align-items:center; justify-content:center; font-weight:800;}

  .hm{margin-top:14px;} .hm-row{margin-bottom:14px;}
  .hm-lab{display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:7px;}
  .hm-grid{display:grid; grid-template-columns:repeat(14,1fr); gap:4px;}
  .hm-grid i{aspect-ratio:1; border-radius:4px; background:#eceef2;}
  .heat-1{background:#c7ecd4;} .heat-2{background:#7ed99b;} .heat-3{background:#3ec46b;} .heat-4{background:#1a9f4b;}

  .filterbar{display:flex; gap:8px; overflow-x:auto; padding:12px 0 2px; -webkit-overflow-scrolling:touch;}
  .filterbar::-webkit-scrollbar{display:none;}
  .chip{flex:none; border:none; background:var(--card); box-shadow:var(--shadow); font-size:12px; font-weight:700; color:var(--muted); padding:8px 14px; border-radius:20px;}
  .chip.on{background:var(--ink); color:#fff;}

</style>

<label id="hapticSwitch" style="position:absolute;opacity:0;pointer-events:none;width:0;height:0;overflow:hidden"><input type="checkbox" switch></label>

<script>
/* ============================================================
   CONFIG — same Entra app as the Backlog / Journal PWAs
   ============================================================ */
const CONFIG = {
  CLIENT_ID: 'd6ab1a1a-efa9-490c-a629-6c37c9431747',
  TENANT:    '0ae860f2-b1e0-4222-b0e1-37314eddf4df',
  DIR:       '/me/drive/root:/0 - Data/AI/Life OS/Health/habits',
  SCOPES:    'Files.ReadWrite offline_access'
};
const REDIRECT_URI = location.origin + location.pathname;
function dayPath(d){ return `${CONFIG.DIR}/${d}.md:/content`; }   // read/write the file bytes
function dayItemPath(d){ return `${CONFIG.DIR}/${d}.md`; }        // the item itself (for DELETE)
function statsPath(){ return `${CONFIG.DIR}/stats.json:/content`; }

/* ---------------- constants ---------------- */
const HABITS=[
  {key:'vitamins', ic:'&#128138;', name:'Vitamins',     hint:'Tap: AM &rarr; PM'},
  {key:'pushups',  ic:'&#128170;', name:'Push-ups',     hint:'Tap to log a set'},
  {key:'drink',    ic:'&#127866;', name:'Drinks',       hint:'Tap each drink'},
  {key:'smoke',    ic:'&#128168;', name:'Smoke breaks', hint:'Tap each session'},
];
const WEEKDAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

/* ---------------- date helpers (LOCAL) ---------------- */
function dkey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function nowHM(){ const n=new Date(); return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`; }
let viewDate=new Date(); viewDate.setHours(0,0,0,0);
const TODAY=new Date(); TODAY.setHours(0,0,0,0);

/* ============================================================
   PKCE AUTH  (vanilla — identical pattern to the other apps)
   ============================================================ */
let accessToken=null;
function b64url(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,''); }
async function genPKCE(){
  const verifier=b64url(crypto.getRandomValues(new Uint8Array(32)));
  const challenge=b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  return {verifier,challenge};
}
async function login(){
  const {verifier,challenge}=await genPKCE();
  const state=b64url(crypto.getRandomValues(new Uint8Array(16)));
  localStorage.setItem('pkce_verifier',verifier); localStorage.setItem('pkce_state',state); localStorage.setItem('auth_error','');
  const p=new URLSearchParams({client_id:CONFIG.CLIENT_ID,response_type:'code',redirect_uri:REDIRECT_URI,scope:CONFIG.SCOPES,code_challenge:challenge,code_challenge_method:'S256',state});
  location.href=`https://login.microsoftonline.com/${CONFIG.TENANT}/oauth2/v2.0/authorize?${p}`;
}
async function exchangeCode(code, returnedState){
  const verifier=localStorage.getItem('pkce_verifier'), savedState=localStorage.getItem('pkce_state');
  if(!verifier){ localStorage.setItem('auth_error','PKCE verifier missing.'); return false; }
  if(savedState && returnedState && savedState!==returnedState){ localStorage.setItem('auth_error','State mismatch.'); return false; }
  try{
    const res=await fetch(`https://login.microsoftonline.com/${CONFIG.TENANT}/oauth2/v2.0/token`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({client_id:CONFIG.CLIENT_ID,grant_type:'authorization_code',code,redirect_uri:REDIRECT_URI,code_verifier:verifier})});
    const data=await res.json();
    if(data.access_token){ accessToken=data.access_token; localStorage.setItem('ms_token',accessToken);
      if(data.refresh_token) localStorage.setItem('ms_refresh',data.refresh_token);
      localStorage.removeItem('pkce_verifier'); localStorage.removeItem('pkce_state'); localStorage.setItem('auth_error','');
      history.replaceState({},'',location.pathname); return true; }
    localStorage.setItem('auth_error', data.error_description||data.error||JSON.stringify(data)); return false;
  }catch(e){ localStorage.setItem('auth_error','Network error: '+e.message); return false; }
}
async function refreshToken(){
  const rt=localStorage.getItem('ms_refresh'); if(!rt) return false;
  try{
    const res=await fetch(`https://login.microsoftonline.com/${CONFIG.TENANT}/oauth2/v2.0/token`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({client_id:CONFIG.CLIENT_ID,grant_type:'refresh_token',refresh_token:rt,scope:CONFIG.SCOPES})});
    const data=await res.json();
    if(data.access_token){ accessToken=data.access_token; localStorage.setItem('ms_token',accessToken); if(data.refresh_token) localStorage.setItem('ms_refresh',data.refresh_token); return true; }
  }catch(e){}
  return false;
}
function signOut(){ accessToken=null; localStorage.removeItem('ms_token'); localStorage.removeItem('ms_refresh'); showGate(); }

async function graphFetch(url, opts={}){
  const res=await fetch('https://graph.microsoft.com/v1.0'+url,{...opts, headers:{Authorization:'Bearer '+accessToken, ...(opts.headers||{})}});
  if(res.status===401){ const ok=await refreshToken(); if(ok) return graphFetch(url,opts); signOut(); return null; }
  return res;
}

/* ============================================================
   MODEL + pipe-delimited format
   ============================================================ */
function blank(){ return {vitamins:{am:null,pm:null}, pushups:[], drinks:[], smoke:[]}; }
const pushTotal = m => m.pushups.reduce((a,p)=>a+p.reps,0);
const vitCount  = m => (m.vitamins.am?1:0)+(m.vitamins.pm?1:0);
function parseDay(md){
  const m=blank(); if(!md) return m;
  md.split(/\r?\n/).forEach(line=>{
    const mm=line.match(/^-\s*(\d{2}:\d{2})\s*\|\s*(\w+)(?:\s*\|\s*(.+))?$/); if(!mm) return;
    const t=mm[1], habit=mm[2], detail=(mm[3]||'').trim();
    if(habit==='vitamins'){ if(detail==='am')m.vitamins.am=t; else if(detail==='pm')m.vitamins.pm=t; }
    else if(habit==='pushups'){ const r=parseInt(detail,10); if(r>0)m.pushups.push({t,reps:r}); }
    else if(habit==='drink'){ m.drinks.push(t); }
    else if(habit==='smoke'){ m.smoke.push({t,note:detail||null}); }
  });
  return m;
}
function renderDayFile(date,m){
  const rows=[];
  if(m.vitamins.am) rows.push([m.vitamins.am,`- ${m.vitamins.am} | vitamins | am`]);
  if(m.vitamins.pm) rows.push([m.vitamins.pm,`- ${m.vitamins.pm} | vitamins | pm`]);
  m.pushups.forEach(p=>rows.push([p.t,`- ${p.t} | pushups | ${p.reps}`]));
  m.drinks.forEach(t=>rows.push([t,`- ${t} | drink`]));
  m.smoke.forEach(s=>rows.push([s.t,`- ${s.t} | smoke${s.note?` | ${s.note}`:''}`]));
  rows.sort((a,b)=> a[0]<b[0]?-1 : a[0]>b[0]?1 : 0);
  return `# Habits — ${date}\n\n## Entries\n${rows.map(r=>r[1]).join('\n')}\n`;
}

/* ============================================================
   CACHE + SYNC  (in-memory truth -> PUT whole file; house style)
   ============================================================ */
const mem={};
function getModel(d){ if(mem[d]) return mem[d]; try{const s=localStorage.getItem('hb_'+d); if(s) return mem[d]=JSON.parse(s);}catch(e){} return mem[d]=blank(); }
function setModel(d,m){ mem[d]=m; localStorage.setItem('hb_'+d, JSON.stringify(m)); }
function dirtySet(){ try{return new Set(JSON.parse(localStorage.getItem('hb_dirty')||'[]'));}catch(e){return new Set();} }
function markDirty(d){ const s=dirtySet(); s.add(d); localStorage.setItem('hb_dirty',JSON.stringify([...s])); updateSyncPill(); }
function clearDirty(d){ const s=dirtySet(); s.delete(d); localStorage.setItem('hb_dirty',JSON.stringify([...s])); updateSyncPill(); }

async function loadDay(date){
  if(!accessToken || !navigator.onLine) return;
  try{
    const res=await graphFetch(dayPath(date)); if(!res) return;
    if(res.status===404){ setModel(date,blank()); }
    else if(res.ok){ setModel(date, parseDay(await res.text())); }
    if(dkey(viewDate)===date && currentTab==='today') renderToday();
  }catch(e){ console.warn('load',date,e); }
}
const savingDates=new Set();
function isEmptyModel(m){ return !m.vitamins.am && !m.vitamins.pm && !m.pushups.length && !m.drinks.length && !m.smoke.length; }
async function saveDay(date){
  markDirty(date);
  if(!accessToken || !navigator.onLine){ updateSyncPill(); return; }
  if(savingDates.has(date)) return;                 // a loop is already running for this date; markDirty guarantees it re-runs
  savingDates.add(date); updateSyncPill();
  try{
    // Keep writing until the remote reflects the CURRENT model. Snapshot-compare
    // closes the log-then-undo race: if the model changed during the request, the
    // written snapshot won't match and we loop again instead of clearing dirty.
    while(dirtySet().has(date)){
      const snapshot=renderDayFile(date, getModel(date));
      const empty=isEmptyModel(getModel(date));
      let res;
      if(empty){
        // Empty day = no file. DELETE it (404 = already gone, also success).
        res=await graphFetch(dayItemPath(date), {method:'DELETE'});
        if(!res || (!res.ok && res.status!==404)) break;
      } else {
        res=await graphFetch(dayPath(date), {method:'PUT', headers:{'Content-Type':'text/plain'}, body:snapshot});
        if(!res || !res.ok) break;
      }
      // Only clear dirty if nothing changed while the request was in flight.
      if(renderDayFile(date, getModel(date))===snapshot) clearDirty(date);
      updateStats(date, getModel(date)).catch(()=>{});
    }
  }catch(e){ console.warn('save',date,e); }
  savingDates.delete(date); updateSyncPill();
}
async function flushDirty(){ for(const d of [...dirtySet()]) saveDay(d); }

async function updateStats(date, model){
  let stats=null;
  try{ const r=await graphFetch(statsPath()); if(r&&r.ok) stats=await r.json(); }catch(e){}
  if(!stats||typeof stats!=='object') stats={v:1,days:{},streaks:{},lifetime:{}};
  stats.days=stats.days||{};
  stats.days[date]={vitamins:vitCount(model),pushups:pushTotal(model),drinks:model.drinks.length,smoke:model.smoke.length};
  let pt=0,dt=0; Object.values(stats.days).forEach(d=>{pt+=d.pushups||0;dt++;});
  stats.lifetime={pushupsTotal:pt,daysTracked:dt};
  const back=(pred)=>{let n=0,d=new Date(TODAY);for(let i=0;i<400;i++){const rec=stats.days[dkey(d)];if(rec&&pred(rec))n++;else break;d=new Date(+d-86400000);}return n;};
  stats.streaks={vitamins_full:back(r=>r.vitamins>=2),pushups:back(r=>r.pushups>0),smoke_free:back(r=>r.smoke===0),alcohol_free:back(r=>r.drinks===0)};
  stats.updated=new Date().toISOString();
  await graphFetch(statsPath(),{method:'PUT',headers:{'Content-Type':'text/plain'},body:JSON.stringify(stats,null,2)});
}

/* ---------------- haptics / toast / sync pill ---------------- */
function haptic(ms=12){ try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){} try{document.getElementById('hapticSwitch').click();}catch(e){} }
let toastT; function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1400); }
function updateSyncPill(){
  const el=document.getElementById('syncPill'), tx=document.getElementById('syncTxt'); if(!el) return;
  const pending=dirtySet().size; el.className='syncpill';
  if(!accessToken){ el.classList.add('off'); tx.textContent='Offline'; }
  else if(!navigator.onLine){ el.classList.add('pending'); tx.textContent=pending?`${pending} to sync`:'No signal'; }
  else if(pending||savingDates.size){ el.classList.add('pending'); tx.textContent='Syncing…'; }
  else{ el.classList.add('ok'); tx.textContent='Synced'; }
}

/* ============================================================
   RENDER — TODAY
   ============================================================ */
function renderToday(){
  const isToday=viewDate.getTime()===TODAY.getTime(), isYest=viewDate.getTime()===TODAY.getTime()-86400000;
  document.getElementById('dayTitle').textContent=isToday?'Today':(isYest?'Yesterday':WEEKDAYS[viewDate.getDay()]);
  document.getElementById('dayDate').textContent=`${MONTHS[viewDate.getMonth()]} ${viewDate.getDate()}, ${viewDate.getFullYear()}`;
  document.getElementById('nextDay').disabled=isToday;
  document.getElementById('jumpToday').classList.toggle('hidden',isToday);
  const m=getModel(dkey(viewDate)), el=document.getElementById('tiles'); el.innerHTML='';
  HABITS.forEach(h=>{
    const t=document.createElement('div'); let inner='',badge='',cls='';
    if(h.key==='vitamins'){
      const n=vitCount(m);
      if(n===2){cls='done'; badge='<span class="badge b-green">Done</span>';}
      else if(n===1){cls='partial'; badge='<span class="badge b-yellow">'+(m.vitamins.am?'AM ✓':'PM ✓')+'</span>';}
      else badge='<span class="badge b-gray">0 / 2</span>';
      inner=`<div><div class="ic">${h.ic}</div><div class="nm">${h.name}</div><div class="hint">${h.hint}</div></div>
        <div class="seg"><i class="${m.vitamins.am?'on':''}"></i><i class="${m.vitamins.pm?'on':''}"></i></div>`;
    } else if(h.key==='pushups'){
      const total=pushTotal(m), sets=m.pushups.length;
      badge=total>0?`<span class="badge b-green">${sets} set${sets>1?'s':''}</span>`:'<span class="badge b-gray">0</span>';
      if(total>0)cls='done';
      inner=`<div><div class="ic">${h.ic}</div><div class="nm">${h.name}</div><div class="hint">${h.hint}</div></div>
        <div class="foot"><div><div class="val">${total}</div><div class="valsub">reps today</div></div></div>`;
    } else {
      const c=h.key==='drink'?m.drinks.length:m.smoke.length;
      badge=c>0?`<span class="badge b-blue">${c}×</span>`:'<span class="badge b-gray">0</span>';
      inner=`<div><div class="ic">${h.ic}</div><div class="nm">${h.name}</div><div class="hint">${h.hint}</div></div>
        <div class="foot"><div><div class="val">${c}</div><div class="valsub">${h.key==='drink'?'drinks':'breaks'} today</div></div></div>`;
    }
    t.className='tile '+cls; t.innerHTML=badge+inner;
    let held=false,timer;
    const start=()=>{held=false;timer=setTimeout(()=>{held=true;haptic(25);openEditSheet(h.key);},450);};
    const end=()=>{clearTimeout(timer); if(!held) tapTile(h.key);};
    t.addEventListener('touchstart',start,{passive:true});
    t.addEventListener('touchend',end);
    t.addEventListener('mousedown',start);
    t.addEventListener('mouseup',end);
    t.addEventListener('mouseleave',()=>clearTimeout(timer));
    el.appendChild(t);
  });
}
function commit(date){ setModel(date,getModel(date)); renderToday(); saveDay(date); }
function tapTile(key){
  const date=dkey(viewDate), m=getModel(date), t=nowHM(); haptic(12);
  if(key==='vitamins'){
    if(!m.vitamins.am){ m.vitamins.am=t; toast('Morning vitamins ✓'); }
    else if(!m.vitamins.pm){ m.vitamins.pm=t; toast('Night vitamins ✓ — all done!'); }
    else { toast('Both logged — hold to edit'); return; }
  } else if(key==='pushups'){ openPushupSheet(); return; }
  else if(key==='drink'){ m.drinks.push(t); toast(`Drink #${m.drinks.length} logged`); }
  else if(key==='smoke'){ m.smoke.push({t,note:null}); toast(`Smoke break #${m.smoke.length}`); }
  commit(date);
}

/* ============================================================
   SHEETS
   ============================================================ */
function openSheet(html){ document.getElementById('sheetBody').innerHTML='<div class="grab"></div>'+html;
  document.getElementById('sheetBack').classList.add('on'); document.getElementById('sheet').classList.add('on'); }
function closeSheet(){ document.getElementById('sheetBack').classList.remove('on'); document.getElementById('sheet').classList.remove('on'); }
let padVal='';
function openPushupSheet(){
  padVal='';
  openSheet(`<h2>Log push-ups</h2><div class="sh-sub">How many in this set?</div>
    <div class="numdisplay" id="numDisp">0</div>
    <div class="quickrow">${[10,15,20,25,50].map(n=>`<button class="quick" data-set="${n}">${n}</button>`).join('')}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-d="${n}">${n}</button>`).join('')}
      <button data-clear="1">C</button><button data-d="0">0</button><button data-del="1">&#9003;</button></div>
    <button class="save" id="savePush">Add set</button>`);
}
function setPadDisp(){ document.getElementById('numDisp').textContent=padVal||'0'; }
function savePushups(){
  const n=parseInt(padVal||'0',10);
  if(n>0){ const date=dkey(viewDate), m=getModel(date); m.pushups.push({t:nowHM(),reps:n});
    toast(m.pushups.length>1?`Set ${m.pushups.length} — overachiever! \u{1F4AA}`:`${n} push-ups logged`); commit(date); }
  haptic(15); closeSheet();
}
function openEditSheet(key){
  const date=dkey(viewDate), m=getModel(date), h=HABITS.find(x=>x.key===key);
  if(key==='vitamins'){
    openSheet(`<h2>Vitamins</h2><div class="sh-sub">Tap to toggle each dose</div>
      <div class="vitrow">
        <button class="vitbtn ${m.vitamins.am?'on':''}" data-vit="am"><span class="vi">&#9728;&#65039;</span>Morning</button>
        <button class="vitbtn ${m.vitamins.pm?'on':''}" data-vit="pm"><span class="vi">&#127769;</span>Night</button>
      </div><button class="save" data-close="1">Done</button>`);
  } else if(key==='pushups'){
    const sets=m.pushups.length, total=pushTotal(m);
    openSheet(`<h2>Push-ups</h2><div class="sh-sub">${total} reps across ${sets} set${sets!==1?'s':''} today</div>
      <div class="sesslist">${sets? m.pushups.map((p,i)=>`Set ${i+1}: <b>${p.reps}</b> reps &middot; ${p.t}`).join('<br>') : 'No sets yet'}</div>
      <button class="save" data-addpush="1">+ Add another set</button>
      ${sets?`<button class="save" style="background:var(--redbg);color:#c0392b;margin-top:10px" data-poppush="1">Remove last set</button>`:''}`);
  } else {
    const c=key==='drink'?m.drinks.length:m.smoke.length;
    openSheet(`<h2>${h.name}</h2><div class="sh-sub">Adjust the count for this day</div>
      <div class="adjrow"><button data-adj="-1" data-habit="${key}">&minus;</button>
        <div class="cnt" id="tallyCnt">${c}</div>
        <button data-adj="1" data-habit="${key}">+</button></div>
      <button class="save" data-close="1">Done</button>`);
  }
}
function toggleVit(slot){
  const date=dkey(viewDate), m=getModel(date);
  m.vitamins[slot]=m.vitamins[slot]?null:nowHM(); haptic(10);
  const b=document.querySelector(`[data-vit="${slot}"]`); if(b) b.classList.toggle('on', !!m.vitamins[slot]);
  commit(date);
}
function adjTally(key,delta){
  const date=dkey(viewDate), m=getModel(date), t=nowHM();
  if(delta>0){ if(key==='drink')m.drinks.push(t); else m.smoke.push({t,note:null}); }
  else { const arr=key==='drink'?m.drinks:m.smoke; if(arr.length)arr.pop(); }
  haptic(10); const c=key==='drink'?m.drinks.length:m.smoke.length;
  const el=document.getElementById('tallyCnt'); if(el)el.textContent=c;
  commit(date);
}
function popPush(){ const date=dkey(viewDate), m=getModel(date); m.pushups.pop(); haptic(10); closeSheet(); commit(date); }

/* ============================================================
   HISTORY
   ============================================================ */
let currentTab='today', histMode='week', monthFilter='all';
let monthCursor=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
function switchTab(t){
  currentTab=t; haptic(8);
  document.getElementById('v-today').classList.toggle('on',t==='today');
  document.getElementById('v-history').classList.toggle('on',t==='history');
  document.getElementById('tab-today').classList.toggle('on',t==='today');
  document.getElementById('tab-history').classList.toggle('on',t==='history');
  if(t==='history') renderHistory();
}
const histLoaded={};
async function ensureDays(dates){
  const need=dates.filter(d=>!histLoaded[d] && !mem[d]);
  await Promise.all(need.map(async d=>{ await loadDay(d); histLoaded[d]=true; }));
}
function score(k){ const m=getModel(k); return {vit:vitCount(m),push:pushTotal(m),drinks:m.drinks.length,smoke:m.smoke.length}; }
function renderHistory(){ if(histMode==='week')renderWeek(); else if(histMode==='14day')renderHeatmap(); else renderMonth(); }

async function renderWeek(){
  const base=new Date(TODAY); const dow=(base.getDay()+6)%7; base.setDate(base.getDate()-dow);
  const days=[...Array(7)].map((_,i)=>{const d=new Date(base);d.setDate(base.getDate()+i);return d;});
  await ensureDays(days.map(dkey));
  const labels=['M','T','W','T','F','S','S'];
  const rows=[
    {name:'&#128138; Vitamins',get:k=>score(k).vit/2,color:'var(--green)'},
    {name:'&#128170; Push-ups',get:k=>score(k).push>0?1:0,color:'var(--blue)'},
    {name:'&#127866; Drinks',get:k=>score(k).drinks,color:'var(--yellow)',count:true},
    {name:'&#128168; Smoke breaks',get:k=>score(k).smoke,color:'#8b5cf6',count:true},
  ];
  let html=`<div class="card"><h3>This Week</h3><div class="csub">${MONTHS[base.getMonth()].slice(0,3)} ${base.getDate()} – ${MONTHS[days[6].getMonth()].slice(0,3)} ${days[6].getDate()}</div>`;
  rows.forEach(r=>{
    const vals=days.map(d=>r.get(dkey(d)));
    if(r.count){ const total=vals.reduce((a,b)=>a+b,0);
      html+=`<div class="wk-item"><div class="wk-top"><span>${r.name}</span><span>${total} this week</span></div>
        <div class="dots">${vals.map((v,i)=>`<b style="${v>0?`background:${r.color};color:#fff`:''}">${v>0?v:labels[i]}</b>`).join('')}</div></div>`;
    } else { const done=vals.filter(v=>v>=1).length, pct=Math.round(vals.reduce((a,b)=>a+b,0)/7*100);
      html+=`<div class="wk-item"><div class="wk-top"><span>${r.name}</span><span>${done}/7 days</span></div>
        <div class="track"><i style="width:${pct}%;background:${r.color}"></i></div>
        <div class="dots">${vals.map((v,i)=>`<b style="${v>=1?`background:${r.color};color:#fff`:(v>0?'background:#d7f0df':'')}">${labels[i]}</b>`).join('')}</div></div>`;
    }
  });
  html+='</div>'; document.getElementById('hist-week').innerHTML=html;
}
async function renderHeatmap(){
  const days=[...Array(14)].map((_,i)=>{const d=new Date(TODAY);d.setDate(TODAY.getDate()-13+i);return d;});
  await ensureDays(days.map(dkey));
  const rows=[
    {name:'&#128138; Vitamins',lvl:k=>{const s=score(k);return s.vit===2?4:(s.vit===1?2:0);}},
    {name:'&#128170; Push-ups',lvl:k=>{const s=score(k);if(!s.push)return 0;return s.push>=100?4:(s.push>=50?3:(s.push>=25?2:1));}},
    {name:'&#127866; Drinks',lvl:k=>{const s=score(k);return s.drinks===0?0:(s.drinks<=2?2:(s.drinks<=4?3:4));}},
    {name:'&#128168; Smoke breaks',lvl:k=>{const s=score(k);return s.smoke===0?0:(s.smoke<=3?2:(s.smoke<=6?3:4));}},
  ];
  let html=`<div class="card"><h3>Last 14 Days</h3><div class="csub">Darker = more. For drinks &amp; smoke, lighter is better.</div><div class="hm">`;
  rows.forEach(r=>{ const cells=days.map(d=>{const l=r.lvl(dkey(d));return `<i class="${l?'heat-'+l:''}"></i>`;}).join('');
    html+=`<div class="hm-row"><div class="hm-lab"><span>${r.name}</span></div><div class="hm-grid">${cells}</div></div>`; });
  html+='</div></div>'; document.getElementById('hist-14day').innerHTML=html;
}
async function renderMonth(){
  const y=monthCursor.getFullYear(), mo=monthCursor.getMonth(), dim=new Date(y,mo+1,0).getDate();
  const dates=[]; for(let dd=1;dd<=dim;dd++){const d=new Date(y,mo,dd); if(d.getTime()<=TODAY.getTime())dates.push(dkey(d));}
  await ensureDays(dates);
  const filters=[{k:'all',n:'All'},{k:'vitamins',n:'&#128138; Vitamins'},{k:'pushups',n:'&#128170; Push-ups'},{k:'drink',n:'&#127866; Drinks'},{k:'smoke',n:'&#128168; Smoke'}];
  let html=`<div class="filterbar">${filters.map(f=>`<button class="chip ${monthFilter===f.k?'on':''}" data-filter="${f.k}">${f.n}</button>`).join('')}</div>`;
  const atThis=(monthCursor.getFullYear()===TODAY.getFullYear()&&monthCursor.getMonth()===TODAY.getMonth());
  html+=`<div class="cal-head"><button class="chev" data-mo="-1">&#8249;</button><h3>${MONTHS[mo]} ${y}</h3><button class="chev" data-mo="1" ${atThis?'disabled':''}>&#8250;</button></div>`;
  html+=`<div class="wd"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div><div class="cal">`;
  const first=new Date(y,mo,1).getDay();
  for(let i=0;i<first;i++) html+='<b class="empty"></b>';
  for(let dd=1;dd<=dim;dd++){
    const d=new Date(y,mo,dd), k=dkey(d), isToday=d.getTime()===TODAY.getTime(), future=d.getTime()>TODAY.getTime();
    if(future){ html+='<b class="empty"></b>'; continue; }
    const s=score(k), any=(s.vit||s.push||s.drinks||s.smoke);
    if(monthFilter==='all'){
      if(any){ html+=`<b class="dots-day ${isToday?'today':''}">${dd}<div class="minidots">
        <u style="background:${s.vit===2?'var(--green)':(s.vit===1?'var(--yellow)':'#dfe2e8')}"></u>
        <u style="background:${s.push>0?'var(--blue)':'#dfe2e8'}"></u>
        <u style="background:${s.drinks>0?'var(--yellow)':'#dfe2e8'}"></u>
        <u style="background:${s.smoke>0?'#8b5cf6':'#dfe2e8'}"></u></div></b>`; }
      else html+=`<b class="${isToday?'today':''}">${dd}</b>`;
      continue;
    }
    let cls='',label='';
    if(monthFilter==='vitamins'){ cls=s.vit===2?'g':(s.vit===1?'y':'r'); label=`${s.vit}/2`; }
    else if(monthFilter==='pushups'){ cls=s.push>0?'g':'r'; label=s.push>0?s.push:''; }
    else if(monthFilter==='drink'){ cls=s.drinks===0?'g':(s.drinks<=2?'y':'r'); label=s.drinks; }
    else if(monthFilter==='smoke'){ cls=s.smoke===0?'g':(s.smoke<=3?'y':'r'); label=s.smoke; }
    html+=`<b class="${cls} ${isToday?'today':''}">${dd}${label!==''?`<span class="mv">${label}</span>`:''}</b>`;
  }
  html+='</div>';
  if(monthFilter==='all') html+=`<div class="legend"><span><i style="background:var(--green)"></i>Vitamins</span><span><i style="background:var(--blue)"></i>Push-ups</span><span><i style="background:var(--yellow)"></i>Drinks</span><span><i style="background:#8b5cf6"></i>Smoke</span></div>`;
  else if(monthFilter==='drink'||monthFilter==='smoke') html+=`<div class="legend"><span><i style="background:var(--green)"></i>None</span><span><i style="background:var(--yellow)"></i>Some</span><span><i style="background:var(--red)"></i>Over</span></div>`;
  else html+=`<div class="legend"><span><i style="background:var(--green)"></i>Done</span><span><i style="background:var(--yellow)"></i>Partial</span><span><i style="background:var(--red)"></i>Missed</span></div>`;
  document.getElementById('hist-month').innerHTML=html;
}

/* ============================================================
   EVENTS
   ============================================================ */
function bindEvents(){
  document.getElementById('prevDay').onclick=()=>{ viewDate=new Date(+viewDate-86400000); haptic(8); renderToday(); loadDay(dkey(viewDate)); };
  document.getElementById('nextDay').onclick=()=>{ if(viewDate.getTime()<TODAY.getTime()){ viewDate=new Date(+viewDate+86400000); haptic(8); renderToday(); loadDay(dkey(viewDate)); } };
  document.getElementById('jumpToday').onclick=()=>{ viewDate=new Date(TODAY); haptic(8); renderToday(); };
  document.getElementById('tab-today').onclick=()=>switchTab('today');
  document.getElementById('tab-history').onclick=()=>switchTab('history');
  document.getElementById('sheetBack').onclick=closeSheet;
  document.getElementById('signInBtn').onclick=login;
  document.getElementById('histToggle').querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{ histMode=b.dataset.h; haptic(8);
      document.getElementById('histToggle').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
      ['week','14day','month'].forEach(mm=>document.getElementById('hist-'+mm).style.display=(mm===histMode?'block':'none'));
      renderHistory(); };
  });
  document.getElementById('sheet').addEventListener('click',e=>{
    const t=e.target.closest('button'); if(!t) return;
    if(t.dataset.set!==undefined){ padVal=t.dataset.set; setPadDisp(); haptic(8); }
    else if(t.dataset.d!==undefined){ if(padVal.length<4){ padVal=(padVal==='0'?'':padVal)+t.dataset.d; setPadDisp(); } }
    else if(t.dataset.del){ padVal=padVal.slice(0,-1); setPadDisp(); }
    else if(t.dataset.clear){ padVal=''; setPadDisp(); }
    else if(t.id==='savePush'){ savePushups(); }
    else if(t.dataset.vit){ toggleVit(t.dataset.vit); }
    else if(t.dataset.addpush){ closeSheet(); openPushupSheet(); }
    else if(t.dataset.poppush){ popPush(); }
    else if(t.dataset.adj){ adjTally(t.dataset.habit, parseInt(t.dataset.adj,10)); }
    else if(t.dataset.close){ closeSheet(); }
  });
  document.getElementById('v-history').addEventListener('click',e=>{
    const t=e.target.closest('button'); if(!t) return;
    if(t.dataset.filter){ monthFilter=t.dataset.filter; haptic(8); renderMonth(); }
    else if(t.dataset.mo){ const dir=parseInt(t.dataset.mo,10);
      const nm=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+dir,1);
      if(nm.getFullYear()>TODAY.getFullYear()||(nm.getFullYear()===TODAY.getFullYear()&&nm.getMonth()>TODAY.getMonth())) return;
      monthCursor=nm; haptic(8); renderMonth(); }
  });
  window.addEventListener('online', ()=>{ updateSyncPill(); flushDirty(); });
  window.addEventListener('offline', updateSyncPill);
}

/* ---------------- gate ---------------- */
function showGate(){ document.getElementById('loading').classList.add('hidden'); const e=localStorage.getItem('auth_error'); if(e) document.getElementById('gateErr').textContent=e; document.getElementById('gate').classList.add('on'); }
function hideGate(){ document.getElementById('gate').classList.remove('on'); document.getElementById('loading').classList.add('hidden'); }

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  bindEvents(); renderToday(); updateSyncPill();
  const params=new URLSearchParams(location.search);
  const code=params.get('code'), urlError=params.get('error'), returnedState=params.get('state');
  if(urlError){ localStorage.setItem('auth_error', params.get('error_description')||urlError); history.replaceState({},'',location.pathname); showGate(); return; }
  if(code){ const ok=await exchangeCode(code, returnedState); if(!ok){ showGate(); return; } }
  else {
    accessToken=localStorage.getItem('ms_token');
    if(accessToken){ const ok=await refreshToken(); if(!ok) accessToken=localStorage.getItem('ms_token'); }
  }
  if(!accessToken){ showGate(); return; }
  hideGate(); updateSyncPill();
  await loadDay(dkey(TODAY)); renderToday();
  flushDirty();
  setInterval(flushDirty, 20000);
}
document.addEventListener('DOMContentLoaded', boot);
</script>
